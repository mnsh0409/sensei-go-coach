[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sensei"
version = "0.1.0"
description = "A Go coaching agent that teaches by playing, built on Meta Model API and KataGo."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "openai>=1.40",
  "python-dotenv>=1.0",
  "numpy>=1.26,<2.3",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "pyyaml>=6.0",
  "pillow>=10.0",
  "sgfmill>=1.1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "httpx>=0.27"]
web = ["fastapi>=0.110", "uvicorn>=0.29"]
chess = ["chess>=1.10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sensei = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra -m 'not engine and not network'"
markers = [
  "engine: needs a working KataGo binary and nets (KATAGO_* in .env)",
  "network: calls Meta Model API (MODEL_API_KEY in .env)",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "BLE"]
